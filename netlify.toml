# Copy goes into WebGL build OUTPUT root (same folder as index.html).
#
# CRITICAL: Deploy the Unity WebGL build folder, NOT the Unity project repo.
# Required files after Build:
#   index.html
#   Build/Build.loader.js
#   Build/Build.framework.js
#   Build/Build.wasm   (or .wasm.gz / .wasm.br)
#   Build/Build.data   (or .data.gz / .data.br)
#   TemplateData/
#   opencv.js
#   wtracker.js
#   arcamera.js
#   ServiceWorker.js
#   StreamingAssets/   (if present)
#
# Netlify UI: Site settings → Build & deploy
#   Publish directory = that build folder (or drag-drop the whole folder).
#   Do NOT publish the GitHub Unity source (Assets/, Library/, …).

[build]
  publish = "."
  # No build command — upload a prebuilt WebGL folder.

# Uncompressed (Compression Format: Disabled) — current project setting
[[headers]]
  for = "/Build/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

[[headers]]
  for = "/Build/*.data"
  [headers.values]
    Content-Type = "application/octet-stream"

[[headers]]
  for = "/Build/*.js"
  [headers.values]
    Content-Type = "application/javascript"

# Gzip — harmless if those files are not deployed
[[headers]]
  for = "/Build/*.wasm.gz"
  [headers.values]
    Content-Type = "application/wasm"
    Content-Encoding = "gzip"

[[headers]]
  for = "/Build/*.data.gz"
  [headers.values]
    Content-Type = "application/octet-stream"
    Content-Encoding = "gzip"

[[headers]]
  for = "/Build/*.js.gz"
  [headers.values]
    Content-Type = "application/javascript"
    Content-Encoding = "gzip"

# Brotli — harmless if those files are not deployed
[[headers]]
  for = "/Build/*.wasm.br"
  [headers.values]
    Content-Type = "application/wasm"
    Content-Encoding = "br"

[[headers]]
  for = "/Build/*.data.br"
  [headers.values]
    Content-Type = "application/octet-stream"
    Content-Encoding = "br"

[[headers]]
  for = "/Build/*.js.br"
  [headers.values]
    Content-Type = "application/javascript"
    Content-Encoding = "br"
